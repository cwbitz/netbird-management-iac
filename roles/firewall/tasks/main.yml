---
# ==============================================================================
# Host firewall (roles/firewall/tasks)
# ==============================================================================
# Default-deny inbound for the NetBird server host, applied through a dedicated
# nftables table and persisted by a oneshot systemd unit that validates before
# loading. The mesh contract (TCP 80/443, UDP 3478 — see
# docs/components/networking.md) plus SSH, the overlay and the overlay's
# WireGuard port stay open; everything else only over the overlay. Never flushes
# the ruleset, so it coexists with Docker, CrowdSec and NetBird.
#
# Safety: the ruleset is validated (`nft -c`) before it is applied, the SSH
# connection is re-checked after applying, and the declared public TCP ports are
# re-proven from the control node once the stack is running — a mistake fails the
# run loudly instead of silently taking the mesh off the internet.
# ==============================================================================

- name: "[Firewall] Stop the previous unit"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ firewall_legacy_services | default([]) }}"
  failed_when: false
  when: not ansible_check_mode

- name: "[Firewall] Retire the previous unit file and ruleset"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ firewall_legacy_paths | default([]) }}"
  when: not ansible_check_mode

- name: "[Firewall] Drop the previous table still loaded in the kernel"
  ansible.builtin.command:
    argv:
      - "{{ firewall_nft }}"
      - delete
      - table
      - inet
      - "{{ item }}"
  loop: "{{ firewall_legacy_tables | default([]) }}"
  changed_when: true
  failed_when: false
  when: not ansible_check_mode

- name: "[Firewall] Assert the nft binary is available"
  ansible.builtin.command: "{{ firewall_nft }} --version"
  register: firewall_nft_version
  changed_when: false
  check_mode: false
  failed_when: false

- name: "[Firewall] Fail when nft is missing"
  ansible.builtin.assert:
    that:
      - firewall_nft_version.rc | default(1) == 0
    fail_msg: >-
      nftables is required by the host firewall but the `nft` binary is missing
      on {{ inventory_hostname }}. Install the `nftables` package (it also ships
      CrowdSec's firewall bouncer) and re-run.

- name: "[Firewall] Assert the port knobs are valid ports"
  ansible.builtin.assert:
    that:
      - firewall_ssh_port | int >= 1
      - firewall_ssh_port | int <= 65535
      - firewall_netbird_wg_port | int >= 1
      - firewall_netbird_wg_port | int <= 65535
      - (firewall_public_tcp_ports | map('int') | select('lt', 1) | list | length) == 0
      - (firewall_public_tcp_ports | map('int') | select('gt', 65535) | list | length) == 0
      - (firewall_public_udp_ports | map('int') | select('lt', 1) | list | length) == 0
      - (firewall_public_udp_ports | map('int') | select('gt', 65535) | list | length) == 0
    fail_msg: >-
      firewall_ports must be 1-65535: ssh={{ firewall_ssh_port }},
      netbird_wg={{ firewall_netbird_wg_port }},
      public_tcp={{ firewall_public_tcp_ports }},
      public_udp={{ firewall_public_udp_ports }}.

- name: "[Firewall] Ensure the nftables config directory exists"
  ansible.builtin.file:
    path: "{{ firewall_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[Firewall] Render the host firewall ruleset"
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: "{{ firewall_conf }}"
    owner: root
    group: root
    mode: "0644"
  register: firewall_rules

- name: "[Firewall] Validate the rendered ruleset"
  ansible.builtin.command: "{{ firewall_nft }} -c -f {{ firewall_conf }}"
  changed_when: false
  when:
    - firewall_rules.changed | bool
    - not ansible_check_mode

- name: "[Firewall] Install the boot unit"
  ansible.builtin.template:
    src: firewall.service.j2
    dest: "{{ firewall_service_path }}"
    owner: root
    group: root
    mode: "0644"

- name: "[Firewall] Enable the boot unit"
  ansible.builtin.systemd_service:
    name: "{{ firewall_service_name }}"
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: "[Firewall] Apply the ruleset when it changed"
  ansible.builtin.systemd_service:
    name: "{{ firewall_service_name }}"
    state: restarted
  when:
    - firewall_rules.changed | bool
    - not ansible_check_mode

- name: "[Firewall] Ensure the boot unit is running"
  ansible.builtin.systemd_service:
    name: "{{ firewall_service_name }}"
    state: started
  when: not ansible_check_mode

- name: "[Firewall] Confirm the host is still reachable"
  ansible.builtin.wait_for_connection:
    timeout: 30
  when: not ansible_check_mode

# The mesh ports are this role's real risk: applying a wrong matrix takes the
# server (dashboard, API, relay, STUN) off the internet. Once the stack is up,
# every declared public TCP port must still answer from the control node. On a
# host where the stack is not running yet the check is skipped by design.
- name: "[Firewall] Check whether the server stack is running"
  community.docker.docker_container_info:
    name: netbird-traefik
  register: firewall_traefik
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: "[Firewall] Verify the public endpoints are still reachable from outside"
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ item | int }}"
    timeout: 5
  loop: "{{ firewall_public_tcp_ports }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - not ansible_check_mode
    - firewall_traefik.container is defined
    - firewall_traefik.container is not none
    - firewall_traefik.container.State.Running | default(false)
