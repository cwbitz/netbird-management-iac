---
# ==============================================================================
# Optional VPS host monitoring + host security (roles/host_monitoring/tasks)
# ==============================================================================
# Installs, on a Debian-family host:
#   * prometheus-node-exporter   — host metrics for central Prometheus/Grafana.
#   * crowdsec                   — log-based detection (SSH brute force, scans)
#                                  from the systemd journal (no rsyslog needed).
#   * crowdsec-firewall-bouncer  — enforces CrowdSec decisions via nftables.
# and, optionally, Docker services:
#   * netbird client             — joins the host to the overlay so a central
#                                  Prometheus/Alloy can reach it with no public
#                                  port (needs a no-route setup key).
#   * grafana/alloy              — ships host logs to a central Loki.
#
# The Debian packages self-configure: crowdsec enables crowdsecurity/linux +
# crowdsecurity/sshd and reads `ssh.service` from journald; the firewall bouncer
# registers its LAPI key against the local LAPI on install.
# ==============================================================================

- name: "[Monitoring] Assert a Debian-family host"
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: >-
      host_monitoring is Debian-family only (apt). Set host_monitoring_enabled:
      false on unsupported hosts.

- name: "[Monitoring] Select the packages to install"
  ansible.builtin.set_fact:
    host_monitoring_packages: >-
      {{ ([host_monitoring_pkg_node_exporter] if host_monitoring_node_exporter_enabled | bool else [])
         + ([host_monitoring_pkg_crowdsec] if host_monitoring_crowdsec_enabled | bool else [])
         + ([host_monitoring_pkg_crowdsec_firewall_bouncer]
            if (host_monitoring_crowdsec_enabled | bool
                and host_monitoring_crowdsec_firewall_bouncer_enabled | bool)
            else []) }}

- name: "[Monitoring] Install the monitoring packages"
  ansible.builtin.apt:
    name: "{{ host_monitoring_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: host_monitoring_packages | length > 0

# ------------------------------------------------------------------------------
# Optional overlay peer + log shipper (Docker services)
# ------------------------------------------------------------------------------
- name: "[Monitoring] Assert a setup key when joining the overlay"
  ansible.builtin.assert:
    that:
      - (host_monitoring_netbird_setup_key | default('', true) | length) > 0
    fail_msg: >-
      host_monitoring_netbird_enabled requires vault_setup_key_vps_enrollment
      (persisted by the tenant apply, or set explicitly in vault.yml).
  when: host_monitoring_netbird_enabled | bool

- name: "[Monitoring] Assert a central Loki URL when shipping logs"
  ansible.builtin.assert:
    that:
      - host_monitoring_netbird_enabled | bool
      - (host_monitoring_loki_url | default('', true) | length) > 0
    fail_msg: >-
      host_monitoring_alloy_enabled requires host_monitoring_netbird_enabled and
      host_monitoring_loki_url (logs are pushed to Loki over the overlay).
  when: host_monitoring_alloy_enabled | bool

- name: "[Monitoring] Ensure the monitoring stack directory exists"
  ansible.builtin.file:
    path: "{{ host_monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: (host_monitoring_netbird_enabled | bool) or (host_monitoring_alloy_enabled | bool)

- name: "[Monitoring] Render the Alloy configuration"
  ansible.builtin.template:
    src: monitoring/config.alloy.j2
    dest: "{{ host_monitoring_dir }}/config.alloy"
    owner: root
    group: root
    mode: "0640"
  when: host_monitoring_alloy_enabled | bool

- name: "[Monitoring] Render the monitoring stack"
  ansible.builtin.template:
    src: monitoring/docker-compose.yml.j2
    dest: "{{ host_monitoring_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: (host_monitoring_netbird_enabled | bool) or (host_monitoring_alloy_enabled | bool)

- name: "[Monitoring] Deploy the monitoring stack"
  community.docker.docker_compose_v2:
    project_src: "{{ host_monitoring_dir }}"
    state: present
    remove_orphans: true
  when:
    - not ansible_check_mode
    - (host_monitoring_netbird_enabled | bool) or (host_monitoring_alloy_enabled | bool)

- name: "[Monitoring] Wait for the overlay interface (wt0)"
  ansible.builtin.command: "ip -4 -o addr show wt0"
  register: host_monitoring_wt0
  until: >-
    host_monitoring_wt0.rc == 0
    and (host_monitoring_wt0.stdout | regex_findall('inet [0-9.]+/') | length > 0)
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false
  when: host_monitoring_netbird_enabled | bool

- name: "[Monitoring] Record the overlay address"
  ansible.builtin.set_fact:
    host_monitoring_overlay_ip: >-
      {{ (host_monitoring_wt0.stdout | default('') | regex_findall('inet ([0-9.]+)/') | first)
         | default('', true) }}
  when: host_monitoring_netbird_enabled | bool

- name: "[Monitoring] Fail when the overlay peer did not come up"
  ansible.builtin.assert:
    that:
      - (host_monitoring_overlay_ip | default('')) | length > 0
    fail_msg: >-
      The NetBird overlay peer did not obtain an address on wt0 within the
      timeout. Check the setup key (vault_setup_key_vps_enrollment) and the
      management URL, and `docker logs netbird`.
  when: host_monitoring_netbird_enabled | bool

# ------------------------------------------------------------------------------
# Host exporters
# ------------------------------------------------------------------------------
- name: "[Monitoring] Build the node_exporter listen addresses"
  ansible.builtin.set_fact:
    host_monitoring_node_exporter_listens: >-
      {{ ['--web.listen-address=' ~ host_monitoring_node_exporter_listen]
         + (['--web.listen-address=' ~ host_monitoring_overlay_ip ~ ':9100']
            if ((host_monitoring_overlay_ip | default('')) | length > 0)
               and (host_monitoring_overlay_ip ~ ':9100' != host_monitoring_node_exporter_listen)
            else []) }}
  when: host_monitoring_node_exporter_enabled | bool

- name: "[Monitoring] Configure the node_exporter listen addresses"
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    content: >-
      ARGS="{{ host_monitoring_node_exporter_listens | join(' ') }}"
    owner: root
    group: root
    mode: "0644"
  when: host_monitoring_node_exporter_enabled | bool
  notify: "[Monitoring] Restart node_exporter"

- name: "[Monitoring] Point the CrowdSec metrics listener at the overlay"
  ansible.builtin.copy:
    dest: /etc/crowdsec/config.yaml.local
    content: |
      prometheus:
        listen_addr: "{{ host_monitoring_overlay_ip }}"
        listen_port: 6060
    owner: root
    group: root
    mode: "0640"
  when:
    - host_monitoring_crowdsec_enabled | bool
    - (host_monitoring_overlay_ip | default('')) | length > 0
  notify: "[Monitoring] Restart crowdsec"

- name: "[Monitoring] Select the services to manage"
  ansible.builtin.set_fact:
    host_monitoring_services: >-
      {{ ([host_monitoring_svc_node_exporter] if host_monitoring_node_exporter_enabled | bool else [])
         + ([host_monitoring_svc_crowdsec] if host_monitoring_crowdsec_enabled | bool else [])
         + ([host_monitoring_svc_crowdsec_firewall_bouncer]
            if (host_monitoring_crowdsec_enabled | bool
                and host_monitoring_crowdsec_firewall_bouncer_enabled | bool)
            else []) }}

- name: "[Monitoring] Enable and start the monitoring services"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ host_monitoring_services }}"
