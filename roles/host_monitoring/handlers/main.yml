---
- name: "[Monitoring] Restart node_exporter"
  ansible.builtin.systemd_service:
    name: "{{ host_monitoring_svc_node_exporter }}"
    state: restarted

- name: "[Monitoring] Restart crowdsec"
  ansible.builtin.systemd_service:
    name: "{{ host_monitoring_svc_crowdsec }}"
    state: restarted
