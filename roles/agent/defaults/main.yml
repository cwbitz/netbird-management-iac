---
# ==============================================================================
# NetBird agent - mesh join (roles/agent/defaults/main.yml)
# ==============================================================================
# Runs the NetBird agent container so the host joins the overlay. Used by the
# monitoring role so a central Prometheus/Alloy can reach the host with no public
# port. The rendered compose dir and the pinned image (agent_dir,
# netbird_agent_version) are role constants in vars/main.yml.

# Mesh setup key: decides which NetBird group the peer auto-joins, hence its role
# in the mesh. Resolved from the management node's vault (single source of truth),
# so the host keeps no copy of the secret. Defaults to the route-less `endpoint`
# key.
netbird_peer_setup_key: >-
  {{ (hostvars[netbird_management_host] | default({})).vault_endpoint_setup_key | default('', true) }}
