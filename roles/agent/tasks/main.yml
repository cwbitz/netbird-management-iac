---
- name: "[Agent] Assert a setup key for the overlay agent"
  ansible.builtin.assert:
    that:
      - (netbird_peer_setup_key | default('', true) | length) > 0
    fail_msg: >-
      An agent node requires a setup key so it joins the mesh. netbird_peer_setup_key is
      resolved from this host's vault (vault_rhost_setup_key); run
      the tenant apply first (it creates the setup keys), or set
      netbird_peer_setup_key explicitly in host_vars.

- name: "[Agent] Ensure Docker Engine and the Compose v2 plugin are present"
  ansible.builtin.include_role:
    name: helpers
    tasks_from: install_docker

- name: "[Agent] Ensure the agent stack directory exists"
  ansible.builtin.file:
    path: "{{ agent_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "[Agent] Inspect any existing overlay container"
  community.docker.docker_container_info:
    name: netbird
  register: agent_existing_container
  failed_when: false

- name: "[Agent] Remove an overlay container owned by another compose project"
  community.docker.docker_container:
    name: netbird
    state: absent
  when:
    - agent_existing_container.container is defined
    - agent_existing_container.container is not none
    - (agent_existing_container.container.Config.Labels | default({})).get('com.docker.compose.project', '')
      not in ['', agent_dir | basename]

- name: "[Agent] Render the agent stack"
  ansible.builtin.template:
    src: agent/docker-compose.yml.j2
    dest: "{{ agent_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "[Agent] Deploy the agent"
  community.docker.docker_compose_v2:
    project_src: "{{ agent_dir }}"
    project_name: "{{ agent_project_name }}"
    state: present
    remove_orphans: true
  when: not ansible_check_mode

- name: "[Agent] Check the overlay daemon health"
  ansible.builtin.command: docker exec netbird netbird status --check live
  register: agent_health
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[Agent] Restart a needs-login overlay container"
  ansible.builtin.command: docker restart netbird
  changed_when: true
  when:
    - not ansible_check_mode
    - agent_health.rc | default(0) != 0

- name: "[Agent] Wait for the overlay interface (wt0)"
  ansible.builtin.command: "ip -4 -o addr show wt0"
  register: agent_wt0_addr
  until: >-
    agent_wt0_addr.rc == 0
    and (agent_wt0_addr.stdout | regex_findall('inet [0-9.]+/') | length > 0)
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[Agent] Record the overlay address"
  ansible.builtin.set_fact:
    overlay_ip: >-
      {{ (agent_wt0_addr.stdout | default('') | regex_findall('inet ([0-9.]+)/') | first)
         | default('', true) }}

- name: "[Agent] Fail when the overlay peer did not come up"
  ansible.builtin.assert:
    that:
      - (overlay_ip | default('')) | length > 0
    fail_msg: >-
      The NetBird overlay agent did not obtain an address on wt0 within the
      timeout. Check the setup key (netbird_peer_setup_key), the management URL
      (domain_name), and `docker logs netbird`.

- name: "[Agent] Verify the managed resolver still resolves public names"
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ agent_dns_probe_host }}"]
  register: agent_public_dns
  until: agent_public_dns.rc == 0
  retries: 6
  delay: 5
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: "[Agent] Fail when the overlay DNS breaks public resolution"
  ansible.builtin.assert:
    that:
      - agent_public_dns.rc | default(1) == 0
    fail_msg: >-
      The overlay agent manages this host's resolver, but public names no longer
      resolve ({{ agent_dns_probe_host }}). A NetBird DNS nameserver group is
      sending this peer's queries to an upstream it cannot reach, and a catch-all
      group (domains: []) then breaks every lookup, including container image
      pulls. Check netbird_dns_nameserver_groups in
      inventory/host_vars/<host>/.config/netbird/tenant.yml: an upstream must be
      reachable (route and policy) from every group it is distributed to, and a
      route-less group (rhost) must never receive a LAN resolver. Fix the
      tenant file, run `make apply`, then re-run this play.
  when: not ansible_check_mode
