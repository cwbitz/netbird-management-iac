---
# ==============================================================================
# NetBird agent - mesh join (roles/agent/tasks)
# ==============================================================================
# Deploys the NetBird agent container so the host joins the overlay. Used by the
# monitoring role.
# ==============================================================================

- name: "[Agent] Assert a setup key for the overlay agent"
  ansible.builtin.assert:
    that:
      - (peer_setup_key | default('', true) | length) > 0
    fail_msg: >-
      An agent node requires a setup key so it joins the mesh. peer_setup_key is
      resolved from the management node's vault (netbird_management_host); run
      the tenant apply there first (it creates the setup keys), or set
      peer_setup_key explicitly in host_vars.

- name: "[Agent] Ensure Docker Engine and the Compose v2 plugin are present"
  ansible.builtin.include_role:
    name: helpers
    tasks_from: install_docker

- name: "[Agent] Enable IP forwarding on a routing node"
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    reload: true
    state: present
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: netbird_agent_routing | bool

- name: "[Agent] Ensure the agent stack directory exists"
  ansible.builtin.file:
    path: "{{ agent_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The agent runs in this role's own compose project: a `netbird` container owned by
# a DIFFERENT compose project is removed first (ours is left alone), so taking over
# ownership converges.
- name: "[Agent] Inspect any existing overlay container"
  community.docker.docker_container_info:
    name: netbird
  register: agent_existing_container
  failed_when: false

- name: "[Agent] Remove an overlay container owned by another compose project"
  community.docker.docker_container:
    name: netbird
    state: absent
  when:
    - agent_existing_container.container is defined
    - agent_existing_container.container is not none
    - (agent_existing_container.container.Config.Labels | default({})).get('com.docker.compose.project', '')
      not in ['', agent_dir | basename]

- name: "[Agent] Render the agent stack"
  ansible.builtin.template:
    src: agent/docker-compose.yml.j2
    dest: "{{ agent_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "[Agent] Deploy the agent"
  community.docker.docker_compose_v2:
    project_src: "{{ agent_dir }}"
    state: present
    remove_orphans: true
  when: not ansible_check_mode

- name: "[Agent] Wait for the overlay interface (wt0)"
  ansible.builtin.command: "ip -4 -o addr show wt0"
  register: agent_wt0_addr
  until: >-
    agent_wt0_addr.rc == 0
    and (agent_wt0_addr.stdout | regex_findall('inet [0-9.]+/') | length > 0)
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[Agent] Record the overlay address"
  ansible.builtin.set_fact:
    overlay_ip: >-
      {{ (agent_wt0_addr.stdout | default('') | regex_findall('inet ([0-9.]+)/') | first)
         | default('', true) }}

- name: "[Agent] Fail when the overlay peer did not come up"
  ansible.builtin.assert:
    that:
      - (overlay_ip | default('')) | length > 0
    fail_msg: >-
      The NetBird overlay agent did not obtain an address on wt0 within the
      timeout. Check the setup key (peer_setup_key), the management URL
      (domain_name), and `docker logs netbird`.
