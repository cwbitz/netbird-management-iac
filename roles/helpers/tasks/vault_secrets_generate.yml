---
# ==============================================================================
# Shared per-host encrypted secret provisioning (per-host worker)
# (roles/helpers/tasks/vault_secrets_generate.yml)
# ==============================================================================
# Invoked once per target host (looped by vault_secrets_dispatch.yml with
# loop_var=target_host, run_once, delegate_to=localhost). Generates secrets
# missing for target_host (undefined, null, or empty/whitespace-only) and
# MERGES them into the authoritative per-host vault file:
#   inventory/host_vars/<target_host>/<vault_secrets_vault_file>
# Existing keys are preserved (fill-if-empty; never rotated), so several calls
# target the same file safely.
# ==============================================================================

- name: "[VaultSecrets] Select missing secret definitions for target host"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.set_fact:
    vault_secrets_missing_for_host: >-
      {%- set ns = namespace(missing=[]) -%}
      {%- for item in vault_secrets_list -%}
      {%-   set value = hostvars[target_host].get(item.var) -%}
      {%-   if (value is none) or ((value | string | trim) | length == 0) -%}
      {%-     set ns.missing = ns.missing + [item] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.missing }}
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultSecrets] Generate and persist secrets for target host"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  when: vault_secrets_missing_for_host | length > 0
  delegate_to: localhost
  become: false
  vars:
    vault_secrets_target_dir: "{{ inventory_dir }}/host_vars/{{ target_host }}"
  block:
    - name: "[VaultSecrets] Ensure per-host inventory vars directory exists"
      ansible.builtin.file:
        path: "{{ vault_secrets_target_dir }}"
        state: directory
        mode: "0700"

    - name: "[VaultSecrets] Generate missing secrets for target host"
      ansible.builtin.command: "openssl rand -{{ item.type }} {{ item.length | int }}"
      register: vault_secret_gen
      changed_when: false
      no_log: true
      loop: "{{ vault_secrets_missing_for_host }}"

    - name: "[VaultSecrets] Collect generated secret values"
      ansible.builtin.set_fact:
        vault_secret_generated: >-
          {{ dict(vault_secret_gen.results
            | map(attribute='item') | map(attribute='var') | list
            | zip(vault_secret_gen.results
            | map(attribute='stdout') | map('regex_replace', '\s', '') | list) | list) }}
      no_log: true

    - name: "[VaultSecrets] Read the existing target vault file"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_read
      vars:
        vault_read_dir: "{{ vault_secrets_target_dir }}"
        vault_read_file: "{{ vault_secrets_vault_file }}"
        vault_read_var: vault_secrets_existing

    - name: "[VaultSecrets] Merge existing keys with newly generated secrets"
      ansible.builtin.set_fact:
        vault_secrets_merged: >-
          {{ (vault_secrets_existing | default({}, true)) | combine(vault_secret_generated) }}
      no_log: true

    - name: "[VaultSecrets] Write the merged keys into the target vault file"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_write
      vars:
        vault_write_dir: "{{ vault_secrets_target_dir }}"
        vault_write_file: "{{ vault_secrets_vault_file }}"
        vault_write_data: "{{ vault_secrets_merged }}"
