---
# ==============================================================================
# Shared per-host encrypted secret store (roles/helpers/tasks/vault_secret_store.yml)
# ==============================================================================
# Persists a PROVIDED value (an externally obtained secret such as an app-issued
# API token) into the per-host vault file named by vault_secret_store_file,
# MERGING it so every other key is preserved:
#   inventory/host_vars/<hostname>/<vault_secret_store_file>
# Unlike vault_secrets_dispatch (which generates random secrets), the value comes
# from the caller. Fill-if-empty: an existing non-empty value is preserved (never
# rotated), so re-running never overwrites a stored token with a freshly minted
# one.
#
# Parameters (passed via include vars):
#   vault_secret_store_component  Human-readable component name (messages/tags)
#   vault_secret_store_file       Vault filename, e.g. vault.yml
#   vault_secret_store_var        Vault variable name to store
#   vault_secret_store_value      Value to store (non-empty string)
# ==============================================================================

- name: "[VaultStore] Validate the store contract"
  tags: [always]
  ansible.builtin.assert:
    that:
      - vault_secret_store_file is defined and (vault_secret_store_file | string | trim) | length > 0
      - vault_secret_store_file is regex('^[a-zA-Z0-9_.-]+\.yml$')
      - vault_secret_store_var is defined and vault_secret_store_var is regex('^[a-zA-Z_][a-zA-Z0-9_]*$')
      - vault_secret_store_value is defined and (vault_secret_store_value | string | trim) | length > 0
    fail_msg: >-
      Invalid {{ vault_secret_store_component | default('vault_secret_store') }}
      store call: vault_secret_store_file must be a safe *.yml filename,
      vault_secret_store_var must match ^[a-zA-Z_][a-zA-Z0-9_]*$, and
      vault_secret_store_value must be non-empty.
  run_once: true
  delegate_to: localhost
  become: false

- name: "[VaultStore] Read the existing target vault file"
  tags: [always]
  ansible.builtin.include_role:
    name: helpers
    tasks_from: vault_read
  vars:
    vault_read_dir: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    vault_read_file: "{{ vault_secret_store_file }}"
    vault_read_var: vault_secret_store_existing

- name: "[VaultStore] Determine whether the value is already stored"
  tags: [always]
  ansible.builtin.set_fact:
    vault_secret_store_missing: >-
      {{ (((vault_secret_store_existing | default({}, true)).get(vault_secret_store_var) | default('', true) | string) | trim) | length == 0 }}
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultStore] Merge and persist the provided secret"
  tags: [always]
  when: vault_secret_store_missing | bool
  delegate_to: localhost
  become: false
  vars:
    vault_secret_store_dir: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    vault_secret_store_merged: >-
      {{ (vault_secret_store_existing | default({}, true))
         | combine({vault_secret_store_var: vault_secret_store_value}) }}
  block:
    - name: "[VaultStore] Write the merged keys into the target vault file"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_write
      vars:
        vault_write_dir: "{{ vault_secret_store_dir }}"
        vault_write_file: "{{ vault_secret_store_file }}"
        vault_write_data: "{{ vault_secret_store_merged }}"
