---
# ==============================================================================
# Group defaults for the NetBird management (server) nodes
# (inventory/group_vars/netbird_management/main.yml)
# ==============================================================================
# Applies to `netbird_management` only (the hosts running roles/management).
# Per-host overrides go in inventory/host_vars/<hostname>/main.yml; image and
# behaviour defaults live in roles/management/defaults/main.yml.

# Target-host directory holding the rendered server stack (docker-compose.yml,
# config.yaml, dashboard.env).
stack_dir: "/opt/netbird"
