# ==============================================================================
# Group defaults for the NetBird agent nodes
# (inventory/group_vars/netbird_agent/main.yml)
# ==============================================================================
# Applies to `netbird_agent` (hosts running only the `agent` role: routing peers
# and plain endpoints). They run the same role; a routing node is only
# `netbird_agent_routing: true` (a per-host knob over the roles/agent default).
# Agent image/tag and directory defaults live in roles/agent/defaults/main.yml.
#
# No group-level variables are required yet; this file reserves the location for
# them (a comment-only file is a valid, empty group_vars file).
