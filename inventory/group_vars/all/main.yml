---
# ==============================================================================
# Global defaults for EVERY managed host (inventory/group_vars/all/main.yml)
# ==============================================================================
# Applies to all nodes (management + agents). Node-type-specific defaults live
# in group_vars/<type>/ (netbird_management, netbird_agent); per-host overrides
# in inventory/host_vars/<hostname>/main.yml; role internals in roles/<role>/.

# Resolved inventory name of the management (server) node. Lets an agent node
# resolve a mesh setup key from the management node's vault (single source of
# truth) instead of copying the secret into every node's vault.
netbird_management_host: "{{ groups['netbird_management'] | default([]) | first | default('', true) }}"

# Install Docker Engine + the Compose v2 plugin from Docker's official apt
# repository when missing (Debian-family). Set false to require a preinstalled
# Docker; the preflight then fails with install guidance.
install_docker: true

# Create/repair the optional human 'admin' operator account during
# `make host-bootstrap`. When true the account is created and ALWAYS gets a
# password (generated into vault.yml when left empty) for console login and
# sudo; a configured public key is installed additionally. Default false: no
# admin account is managed (least privilege).
host_admin_enabled: false
