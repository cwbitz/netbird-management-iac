---
crowdsec_defaults:
  enabled: false
  generate_webui_machine_password: false
  blocklist_import:
    enabled: false
    preset: "server"
    interval: 3600
    max_decisions: 15000
    batch_size: 1000
    decision_duration: "24h"
    extra_env: {}

crowdsec_cfg: "{{ crowdsec_defaults | combine(crowdsec | default({}, true), recursive=True) }}"
crowdsec_enabled: "{{ crowdsec_cfg.enabled }}"
crowdsec_generate_webui_machine_password: "{{ crowdsec_cfg.generate_webui_machine_password }}"
crowdsec_blocklist_import_enabled: "{{ crowdsec_cfg.blocklist_import.enabled }}"
crowdsec_blocklist_import_preset: "{{ crowdsec_cfg.blocklist_import.preset }}"
crowdsec_blocklist_import_interval: "{{ crowdsec_cfg.blocklist_import.interval }}"
crowdsec_blocklist_import_max_decisions: "{{ crowdsec_cfg.blocklist_import.max_decisions }}"
crowdsec_blocklist_import_batch_size: "{{ crowdsec_cfg.blocklist_import.batch_size }}"
crowdsec_blocklist_import_decision_duration: "{{ crowdsec_cfg.blocklist_import.decision_duration }}"
crowdsec_blocklist_import_extra_env: "{{ crowdsec_cfg.blocklist_import.extra_env }}"
