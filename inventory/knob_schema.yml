---
operator_knob_schema:
  is_test_host: "is_test_host is not defined or is_test_host is boolean"
  admin_username: "admin_username is not defined or admin_username is string"
  ssh_keys: >-
    ssh_keys is not defined
    or ((ssh_keys is mapping)
        and ((ssh_keys.keys() | difference(['iac', 'admin', 'root']) | length) == 0)
        and ((ssh_keys | dict2items | map(attribute='value') | select('mapping') | list | length)
             == (ssh_keys | length))
        and ((ssh_keys | dict2items | map(attribute='value') | map('dict2items') | flatten(levels=1)
              | rejectattr('key', 'in', ['pubkey', 'privkey']) | list | length) == 0)
        and ((ssh_keys | dict2items | map(attribute='value')
              | map(attribute='pubkey', default='') | select('string') | list | length)
             == (ssh_keys | length))
        and ((ssh_keys | dict2items | map(attribute='value')
              | map(attribute='privkey', default='') | select('string') | list | length)
             == (ssh_keys | length)))
  agent_key_lifetime: "agent_key_lifetime is not defined or agent_key_lifetime is match('^[0-9]+[smhdw]?$')"
  install_docker: "install_docker is not defined or install_docker is boolean"
  timezone: >-
    (timezone | default('', true) | string | trim) == ''
    or (timezone | string) is match('^[A-Za-z0-9_+/-]+$')
  mirrors: >-
    mirrors is not defined
    or ((mirrors is mapping)
        and ((mirrors.keys() | difference(['apt', 'docker_registry']) | length) == 0)
        and ((((mirrors | default({}, true)).apt | default('', true)) | string | trim) == ''
             or (((mirrors | default({}, true)).apt | string) is match('^https?://[^\s]+$')))
        and (((mirrors | default({}, true)).docker_registry | default([])) is sequence)
        and (((mirrors | default({}, true)).docker_registry | default([])) is not string)
        and (((mirrors | default({}, true)).docker_registry | default([])) is not mapping))
  create_admin_user: "create_admin_user is not defined or create_admin_user is boolean"
  allow_root_login: "allow_root_login is not defined or allow_root_login is boolean"
  firewall: "firewall is not defined or firewall is mapping"
  sshd: "sshd is not defined or sshd is mapping"
  monitoring: "monitoring is not defined or monitoring is mapping"
  server: "server is not defined or server is mapping"
  tenant_strict: "tenant_strict is not defined or tenant_strict is boolean"
  netbird_settings: "netbird_settings is not defined or netbird_settings is mapping"
  netbird_groups: >-
    netbird_groups is not defined or ((netbird_groups is sequence) and not (netbird_groups is string) and not (netbird_groups is mapping))
  netbird_policies: >-
    netbird_policies is not defined or ((netbird_policies is sequence) and not (netbird_policies is string) and not (netbird_policies is
    mapping))
  netbird_posture_checks: >-
    netbird_posture_checks is not defined or ((netbird_posture_checks is sequence) and not (netbird_posture_checks is string) and not
    (netbird_posture_checks is mapping))
  netbird_networks: >-
    netbird_networks is not defined or ((netbird_networks is sequence) and not (netbird_networks is string) and not (netbird_networks is
    mapping))
  netbird_dns_nameserver_groups: >-
    netbird_dns_nameserver_groups is not defined or ((netbird_dns_nameserver_groups is sequence) and not (netbird_dns_nameserver_groups is
    string) and not (netbird_dns_nameserver_groups is mapping))
  netbird_dns_zones: >-
    netbird_dns_zones is not defined or ((netbird_dns_zones is sequence) and not (netbird_dns_zones is string) and not (netbird_dns_zones is
    mapping))
  netbird_dns_disabled_management_groups: >-
    netbird_dns_disabled_management_groups is not defined or ((netbird_dns_disabled_management_groups is sequence) and not
    (netbird_dns_disabled_management_groups is string) and not (netbird_dns_disabled_management_groups is mapping))
  netbird_setup_keys: >-
    netbird_setup_keys is not defined or ((netbird_setup_keys is sequence) and not (netbird_setup_keys is string) and not (netbird_setup_keys is
    mapping))
  netbird_services: >-
    netbird_services is not defined or ((netbird_services is sequence) and not (netbird_services is string) and not (netbird_services is
    mapping))
  netbird_service_domains: >-
    netbird_service_domains is not defined or ((netbird_service_domains is sequence) and not (netbird_service_domains is string) and not
    (netbird_service_domains is mapping))
  netbird_users: "netbird_users is not defined or ((netbird_users is sequence) and not (netbird_users is string) and not (netbird_users is mapping))"
  netbird_service_users: >-
    netbird_service_users is not defined or ((netbird_service_users is sequence) and not (netbird_service_users is string) and not
    (netbird_service_users is mapping))

# Per-key expressions of the grouped mappings (firewall, sshd, monitoring,
# server), keyed by the dotted path the operator sees in the host's main.yml.
operator_knob_nested:
  firewall.enabled: >-
    ((firewall | default({}, true)).enabled | default(false)) is boolean
  firewall.allow_icmp: >-
    ((firewall | default({}, true)).allow_icmp | default(true)) is boolean
  sshd.hardening_enabled: >-
    ((sshd | default({}, true)).hardening_enabled | default(false)) is boolean
  sshd.permit_root_login: >-
    ((sshd | default({}, true)).permit_root_login | default('no') | string)
    in ["no", "prohibit-password"]
  monitoring.node_exporter.enabled: >-
    (((monitoring | default({}, true)).node_exporter | default({})).enabled
     | default(false)) is boolean
  monitoring.node_exporter.collectors: >-
    (((monitoring | default({}, true)).node_exporter | default({})).collectors
     | default([])) is sequence and
    not ((((monitoring | default({}, true)).node_exporter | default({})).collectors
     | default([])) is string) and
    not ((((monitoring | default({}, true)).node_exporter | default({})).collectors
     | default([])) is mapping)
  monitoring.crowdsec.enabled: >-
    (((monitoring | default({}, true)).crowdsec | default({})).enabled
     | default(false)) is boolean
  monitoring.crowdsec.generate_webui_machine_password: >-
    (((monitoring | default({}, true)).crowdsec | default({})).generate_webui_machine_password
     | default(false)) is boolean
  monitoring.crowdsec.blocklist_import: >-
    (((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})) is mapping
  monitoring.crowdsec.blocklist_import.enabled: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).enabled | default(false)) is boolean
  monitoring.crowdsec.blocklist_import.preset: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).preset | default('server') | string)
    in ['embedded', 'server', 'max']
  monitoring.crowdsec.blocklist_import.interval: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).interval | default(3600) | int) >= 0
  monitoring.crowdsec.blocklist_import.max_decisions: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).max_decisions | default(15000) | int) >= 0
  monitoring.crowdsec.blocklist_import.batch_size: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).batch_size | default(1000) | int) >= 1
  monitoring.crowdsec.blocklist_import.decision_duration: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).decision_duration | default('24h') | string)
    is match('^[0-9]+[smh]$')
  monitoring.crowdsec.blocklist_import.extra_env: >-
    ((((monitoring | default({}, true)).crowdsec | default({})).blocklist_import
     | default({})).extra_env | default({})) is mapping
  monitoring.alloy.enabled: >-
    (((monitoring | default({}, true)).alloy | default({})).enabled
     | default(false)) is boolean
  monitoring.alloy.loki_push_url: >-
    (((monitoring | default({}, true)).alloy | default({})).loki_push_url
     | default('', true) | string | trim) == ''
    or (((monitoring | default({}, true)).alloy | default({})).loki_push_url
    | string) is match('^https?://[^\s]+$')
  monitoring.alloy.prometheus_remote_write_url: >-
    (((monitoring | default({}, true)).alloy | default({})).prometheus_remote_write_url
     | default('', true) | string | trim) == ''
    or ((((monitoring | default({}, true)).alloy | default({})).prometheus_remote_write_url
         | string) is match('^https?://[^\s]+$')
        and (((monitoring | default({}, true)).alloy | default({})).prometheus_remote_write_url
             | string | trim | regex_replace('/+$', '')) is not search('/api/v1/write$'))
  monitoring.alloy.verify_push: >-
    (((monitoring | default({}, true)).alloy | default({})).verify_push
     | default(false)) is boolean
  monitoring.alloy.verify_receiver.mode: >-
    ((((monitoring | default({}, true)).alloy | default({})).verify_receiver
     | default({})).mode | default('disabled') | string) in ['disabled', 'ack']
  monitoring.alloy.verify_receiver.port: >-
    ((((monitoring | default({}, true)).alloy | default({})).verify_receiver
     | default({})).port | default(3100, true) | string) is match('^[0-9]+$')
    and ((((monitoring | default({}, true)).alloy | default({})).verify_receiver
     | default({})).port | default(3100, true) | int) >= 1
    and ((((monitoring | default({}, true)).alloy | default({})).verify_receiver
     | default({})).port | default(3100, true) | int) <= 65535
  monitoring.alloy.scrape_interval: >-
    (((monitoring | default({}, true)).alloy | default({})).scrape_interval
     | default('15s') | string) is match('^([1-9]|[12][0-9]|30)s$')
  monitoring.alloy.journal_presets: >-
    (((monitoring | default({}, true)).alloy | default({})).journal_presets
     | default([])) is sequence and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_presets
     | default([])) is string) and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_presets
     | default([])) is mapping)
  monitoring.alloy.journal_extras: >-
    (((monitoring | default({}, true)).alloy | default({})).journal_extras
     | default([])) is sequence and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_extras
     | default([])) is string) and
    not ((((monitoring | default({}, true)).alloy | default({})).journal_extras
     | default([])) is mapping)
  server.domain_name: >-
    ((server | default({}, true)).domain_name | default('netbird.example.com')) is string
    and (((server | default({}, true)).domain_name | default('netbird.example.com'))
    | string | trim | length) > 0
  server.acme_email: >-
    ((server | default({}, true)).acme_email | default('admin@example.com')) is string
    and (((server | default({}, true)).acme_email | default('admin@example.com'))
    | string | trim) is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
  server.exposed_port: >-
    (((server | default({}, true)).exposed_port | default(443, true) | string)
     is match('^[0-9]+(-[0-9]+)?$')) and
    (((server | default({}, true)).exposed_port | default(443, true) | string
     | regex_replace('-[0-9]+$', '') | int) >= 1) and
    (((server | default({}, true)).exposed_port | default(443, true) | string
     | regex_replace('^[0-9]+-', '') | int) <= 65535)
  server.stun_port: >-
    (((server | default({}, true)).stun_port | default(3478, true) | string)
     is match('^[0-9]+(-[0-9]+)?$')) and
    (((server | default({}, true)).stun_port | default(3478, true) | string
     | regex_replace('-[0-9]+$', '') | int) >= 1) and
    (((server | default({}, true)).stun_port | default(3478, true) | string
     | regex_replace('^[0-9]+-', '') | int) <= 65535)
  server.log_level: >-
    ((server | default({}, true)).log_level | default('info') | string)
    in ["trace", "debug", "info", "warn", "error"]
  server.stack_dir: >-
    ((server | default({}, true)).stack_dir | default('/opt/netbird')) is string
    and (((server | default({}, true)).stack_dir | default('/opt/netbird'))
    is match('^/[^\s]+$'))
  server.disable_geolite_update: >-
    ((server | default({}, true)).disable_geolite_update | default(false)) is boolean
  server.server_ready_retries: >-
    ((server | default({}, true)).server_ready_retries | default(120, true) | string)
    is match('^[0-9]+$') and
    ((server | default({}, true)).server_ready_retries | default(120, true) | int) >= 1 and
    ((server | default({}, true)).server_ready_retries | default(120, true) | int) <= 1000
  server.tls_wait_retries: >-
    ((server | default({}, true)).tls_wait_retries | default(24, true) | string)
    is match('^[0-9]+$') and
    ((server | default({}, true)).tls_wait_retries | default(24, true) | int) >= 1 and
    ((server | default({}, true)).tls_wait_retries | default(24, true) | int) <= 1000
  server.trusted_peers: >-
    ((server | default({}, true)).trusted_peers | default([])) is sequence and
    not (((server | default({}, true)).trusted_peers | default([])) is string) and
    not (((server | default({}, true)).trusted_peers | default([])) is mapping)
  server.service_admin_access_token_expire_days: >-
    ((server | default({}, true)).service_admin_access_token_expire_days | default(365)) is number
    and not (((server | default({}, true)).service_admin_access_token_expire_days | default(365)) is boolean)
