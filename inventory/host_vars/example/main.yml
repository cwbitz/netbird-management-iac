---
# ==============================================================================
# Per-host configuration template (inventory/host_vars/example/main.yml)
# ==============================================================================
# `make prep` copies this file to inventory/host_vars/<hostname>/main.yml.
# Every knob is listed below with its default. Secrets and PII live in the
# vault.yml next to it.

# --- Deployment scope ---------------------------------------------------------
# Test-purpose host: `make deploy` without HOST skips it; an explicit
# HOST=<name> still deploys it.
is_test_host: false

# --- SSH connection identities ------------------------------------------------
# Account name and key paths are non-secret (passwords stay in vault.yml).
# The optional human `admin` account may be renamed; `iac` is a fixed name. It is
# created only while create_admin_user is true (it always gets a password,
# generated into vault.yml when empty, plus any configured key).
create_admin_user: false
admin_username: "admin"
ssh_keys:
  root:
    pubkey: ""
    privkey: ""
  admin:
    pubkey: ""
    privkey: ""
  iac:
    pubkey: ""
    privkey: ""
# Lifetime of the identities loaded into the control node's ssh-agent
# (OpenSSH duration, e.g. 8h, 1d, 30m; 0 keeps them until the agent exits).
agent_key_lifetime: "8h"

# --- Host baseline (make deploy) ----------------------------------------------
# install_docker false requires a preinstalled Docker. Mirrors for hosts where the
# defaults are slow or blocked; the security repo follows mirrors.apt.
install_docker: true
# IANA timezone for the host clock and journal timestamps (empty keeps the
# image's setting).
timezone: "UTC"
mirrors:
  # Debian suite root (empty keeps the image's official sources); the security
  # suite derives from it.
  apt: ""
  # Docker Hub pull-through mirrors; e.g. ["https://mirror.gcr.io"] is the
  # fastest from an APAC/JP host (it also lifts Docker Hub's anonymous pull
  # limit).
  docker_registry: []
# Escape hatch: run the deploy as root instead of the service account.
allow_root_login: false

# --- SSH hardening (make deploy TAGS=sshd) ------------------------------------
# Key-only SSH administration, opt-in (make deploy TAGS=sshd). Enable it only
# once a keyed login works for `iac` (or root when that is the only admin
# path); the role verifies that and rolls back otherwise.
sshd:
  hardening_enabled: false
  # Root SSH policy, applied only while the hardening toggle above is true: "no"
  # disables root SSH; "prohibit-password" keeps root reachable by public key
  # only (needed on a host administered only through root).
  permit_root_login: "no"

# --- Host firewall -------------------------------------------------------------
# Default-deny inbound, opt-in (make deploy TAGS=firewall). Keeps the public
# surface at the mesh contract (TCP 80/443, UDP 3478) plus SSH and the overlay;
# the port matrix is fixed, not configurable.
firewall:
  enabled: false
  allow_icmp: true

# --- Host monitoring + host security (make monitoring) -----------------------
# prometheus-node-exporter + CrowdSec (+ the nftables firewall bouncer) and the
# NetBird overlay join, so the central Prometheus/Alloy scrapes the host over the
# overlay with no public port. Opt-in per host: enable any component below and
# the monitoring slice runs; disabling all three retires it and each toggle
# converges off too (the packages stay installed).
monitoring:
  node_exporter:
    enabled: false
    # node_exporter collector toggles enabled on top of the package defaults.
    collectors:
      - buddyinfo
      - cgroups
      - drm
      - ethtool
      - interrupts
      - ksmd
      - lnstat
      - logind
      - mountstats
      - perf
      - processes
      - qdisc
      - softirqs
      - sysctl
      - tcpstat
      - wifi
      - xfrm
      - zoneinfo
  crowdsec:
    enabled: false
    # Serve the central CrowdSec web UI: create its read-only machine account on
    # this LAPI. The password is generated into this host's vault as
    # vault_crowdsec_webui_machine_password when the vault has none, and copied
    # into the reading project's vault mapping.
    generate_webui_machine_password: false
    # CrowdSec blocklist importer (optional; runs next to the local LAPI).
    # embedded ~= 20k high-confidence IPs, server = conservative server set,
    # max = all 32 feeds. Lower max_decisions and raise interval on small VPSes.
    blocklist_import:
      enabled: false
      preset: "server"
      interval: 3600
      max_decisions: 15000
      batch_size: 1000
      decision_duration: "24h"
      extra_env: {}
  alloy:
    # Ship host logs to a central Loki reachable over the overlay (alloy.enabled
    # requires loki_push_url).
    enabled: false
    # Central Loki endpoint over the overlay: an overlay IP, or preferably the
    # central peer's NetBird name ("http://<peer>.netbird.selfhosted:3100"), which
    # survives a re-enrolled central peer.
    loki_push_url: ""
    # Central Prometheus remote-write receiver over the overlay (an overlay IP or
    # the peer's NetBird name); the role appends /api/v1/write. Empty = metrics
    # are not pushed; log shipping is unaffected.
    prometheus_remote_write_url: ""
    # Opt-in check on the push itself: after the stack is up, snapshot Alloy's
    # own counters and fail when the remote-write receiver acknowledged no new
    # scraped sample, or a write was dropped while the check ran. Values from
    # before the check are the baseline, so a re-run after a transient outage
    # can pass. Leave it off when the receiver may be unreachable at deploy
    # time; verify_receiver.mode: ack switches it on by itself.
    verify_push: false
    # Local self-check for a test host: deploy a loopback-only receiver that
    # acknowledges both write paths, derive loki_push_url and
    # prometheus_remote_write_url from verify_receiver.port, and verify the push
    # without a real central stack. "disabled"
    # (default) keeps Alloy pointed at the URLs above; "ack" (only while alloy is
    # enabled) requires both of them to be empty and always runs the push check.
    # Test hosts only: the data is acknowledged and discarded.
    verify_receiver:
      mode: "disabled"
      port: 3100
    # Metric scrape cadence behind the remote-write push. It has to stay inside
    # the dashboards' 60s `rate()` window (1s-30s); a 60s cadence leaves every
    # `rate()` panel empty.
    scrape_interval: "15s"
    # Journal sources Alloy ships to the central Loki; raw extra matches go in
    # journal_extras.
    journal_presets: [ssh, security, kernel, services]
    journal_extras: []

# --- Server -------------------------------------------------------------------
server:
  # The FQDN the server is reachable at; its A record must point at this host,
  # with TCP 80/443 and UDP 3478 open. The placeholder fails the deploy.
  domain_name: "netbird.example.com"
  acme_email: "admin@example.com"
  # The advertised HTTPS port, STUN/TURN port and log level. The firewall follows
  # these two ports; the scheme is always https (Traefik + ACME).
  exposed_port: 443
  stun_port: 3478
  log_level: "info"
  # Skip the GeoLite2 download at startup (needs pkgs.netbird.io; set true on
  # air-gapped or slow-CDN hosts; disables geo-based posture checks).
  disable_geolite_update: false
  stack_dir: "/opt/netbird"
  # Start-up waits: the server logs a started HTTP listener (the geolocation
  # databases download on first boot and can take minutes), then the public TLS
  # endpoint must answer. Raise the first one on a slow link, lower the second to
  # fail faster when ACME cannot issue.
  server_ready_retries: 120
  tls_wait_retries: 24
  # Extra management addresses trusted as a reverse proxy (external proxy
  # setups); Traefik is covered by traefik_ip. Example: ["203.0.113.20/32"].
  trusted_peers: []
  # Lifetime (days) of the 'admin' service-user PAT minted by the first-owner
  # bootstrap (NetBird caps PATs at 365 days).
  service_admin_access_token_expire_days: 365
