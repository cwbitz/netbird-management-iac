---
# ==============================================================================
# Per-host configuration template (inventory/host_vars/example/main.yml)
# ==============================================================================
# Copy to inventory/host_vars/<hostname>/main.yml for each host (real <hostname>/
# directories are gitignored). Secrets/PII go in the encrypted vault.yml next to
# it.

# --- SSH connection identity -------------------------------------------------
# The ansible/admin/root aliases are wired in
# inventory/group_vars/netbird_management/main.yml; the user/password/key paths
# live in vault.yml. `make host-bootstrap` probes [ansible, admin, root] and uses
# the first that works.

# --- Public endpoint (per host, not a secret) --------------------------------
# The FQDN the server is reachable at; its A record must point at this host and
# ports 80/443 TCP + 3478 UDP must be open. The role refuses to deploy while this
# is still the placeholder.
domain_name: "netbird.example.com"
letsencrypt_email: "{{ vault_letsencrypt_email }}"

# --- Optional first-owner bootstrap ------------------------------------------
# Set owner_email to create the first owner via /api/setup (this also provisions
# the tenant PAT into vault.yml); leave it empty to onboard manually at
# https://<domain>/setup. An empty owner_password is generated into vault.yml.
owner_email: "{{ vault_owner_email | default('', true) }}"
owner_name: "{{ vault_owner_name | default('', true) }}"
owner_password: "{{ vault_owner_password | default('', true) }}"

# [OPTIONAL] Skip the GeoLite2 download at startup (needs pkgs.netbird.io; set
# true on air-gapped or slow-CDN hosts).
# disable_geolite_update: true

# --- Optional host monitoring + host security (make monitoring) --------------
# Opt-in (default off): installs prometheus-node-exporter + CrowdSec (+ the
# nftables firewall bouncer) and joins the host to the overlay via the agent role.
# monitoring_enabled: true
# node_exporter_listen_addr: "127.0.0.1:9100"   # localhost + the overlay address
# alloy_enabled: true                           # ship host logs to a central Loki
# loki_url: "http://<loki-overlay-ip>:3100"

# --- Node type (inventory group) ---------------------------------------------
# This host runs the server stack (the `netbird_management` inventory group). It
# joins the NetBird overlay only when monitoring is enabled (see above).

# --- Optional host bootstrap (make host-bootstrap) ---------------------------
# Region-specific mirrors for hosts where the defaults are slow or blocked;
# opt-in and NOT part of make deploy.
# host_apt_mirror: "https://mirrors.tuna.tsinghua.edu.cn/debian"
# docker_registry_mirrors:
#   - "https://docker.1ms.run"
# The optional human 'admin' account is created only when enabled here; it always
# gets a password (generated into vault.yml when empty) plus any configured key.
# host_admin_enabled: true

# ==============================================================================
# Tenant configuration (playbooks/tenant.yml)
# ==============================================================================
# Desired state for the NetBird account (users, groups, policies, networks, DNS,
# settings, ...), applied to the running server's REST API via
# community.ansible_netbird. `make plan` previews; `make apply` commits.
# tenant_strict: true additionally removes unmanaged resources (off by default).

# --- Account settings (settings.yml) -----------------------------------------
# Account-wide settings, each shown with its default; group lists accept plain
# names (resolved to IDs). ENTERPRISE-gated options are marked.
# netbird_settings:
#   # Authentication
#   peer_login_expiration_enabled: true        # require periodic SSO re-auth (setup-key peers exempt)
#   peer_login_expire_seconds: 604800          # 7 days
#   peer_inactivity_expiration_enabled: false
#   peer_inactivity_expire_seconds: 2592000    # 30 days
#   extra_user_approval_required: false        # approve users auto-joining by email domain
#   # extra_peer_approval_enabled: false       # ENTERPRISE
#   # Permissions
#   regular_users_view_blocked: false
#   # User groups
#   groups_propagation_enabled: true
#   jwt_groups_enabled: false
#   jwt_groups_claim_name: "groups"
#   jwt_allow_groups: []
#   # Networks
#   dns_domain: "netbird.selfhosted"           # keep a non-public domain
#   network_range: "100.64.0.0/10"             # changing re-allocates all peer IPs
#   network_range_v6: "fd00::/64"
#   ipv6_enabled_groups: []                    # empty = disable IPv6 overlay
#   routing_peer_dns_resolution_enabled: true
#   # extra_network_traffic_logs_enabled: false
#   # extra_network_traffic_logs_groups: []
#   # extra_network_traffic_packet_counter_enabled: false  # ENTERPRISE
#   # Clients
#   lazy_connection_enabled: false
#   auto_update_version: "disabled"            # disabled | latest | a version
#   auto_update_always: false
#   peer_expose_enabled: false
#   peer_expose_groups: []
#
tenant_strict: false

# --- Groups (access_control/groups.yml) --------------------------------------
# Do NOT list the auto-managed "All" group.
# netbird_groups:
#   - name: "personal"
#   - name: "guests"
#
# --- Policies / ACL (access_control/policies.yml) ----------------------------
# netbird_policies:
#   - name: "personal-to-guests"
#     description: "Let the owner reach guest machines over SSH"
#     enabled: true
#     rules:
#       - name: "ssh"
#         enabled: true
#         sources: ["personal"]
#         destinations: ["guests"]
#         bidirectional: false
#         protocol: "tcp"
#         ports: ["22"]
#         action: "accept"
#     state: present
#
# --- Posture checks (access_control/posture_checks.yml) ----------------------
# netbird_posture_checks: []
#
# --- Networks (networks.yml) -------------------------------------------------
# A routed network binds its gateway by peer GROUP (routers[].peer_groups), not
# by an individual peer; the client's setup key auto-assigns that group, so the
# network can be created on the first run.
# netbird_networks: []
#
# --- DNS (dns/nameservers.yml, dns/zones.yml, dns/settings.yml) --------------
# netbird_dns_nameserver_groups: []
# netbird_dns_zones: []
# netbird_dns_disabled_management_groups: []
#
# --- Setup keys (setup_keys.yml) ---------------------------------------------
# The secret is returned only at creation and then persisted to vault.yml as
# vault_<setup-key-name> (e.g. docker_host_setup_key ->
# vault_docker_host_setup_key). expires_in is seconds, 1..31536000; a never-expiring key
# (expires_in: 0) is not expressible here (create it once via the API instead).
# netbird_setup_keys: []
#   - name: "server-enrollment"
#     key_type: "reusable"          # one-off | reusable
#     expires_in: 31536000          # seconds, 1..31536000 (1 year max)
#     auto_groups: ["servers"]
#     usage_limit: 0                # 0 = unlimited
#     ephemeral: false
#     state: present
#
# --- Services (services.yml) -------------------------------------------------
# Services and custom domains need a registered proxy cluster, which only the
# self-hosted proxy software itself can create.
# netbird_services: []
# netbird_service_domains: []
#
# --- Users / service users (applied directly, not via a config file) ---------
# Local-user passwords are returned once (not persisted); prefer invites, and put
# sensitive emails in vault.yml. IdP-driven provisioning (SCIM/IdP sync) is
# Enterprise; manual users are Community.
# netbird_users:
#   - email: "alice@example.com"
#     name: "Alice"
#     role: "user"            # owner | admin | user
#     auto_groups: ["personal"]
#     state: present
# netbird_service_users:
#   - name: "automation"
#     role: "admin"
#     auto_groups: []
#     state: present

# --- Host bootstrap (make host-bootstrap) -------------------------------------
# Optional per-host APT security mirror (empty = the distro default).
host_apt_security_mirror: ""
