---
# ==============================================================================
# Join agent-only mesh nodes to the NetBird overlay (agent only).
#
#   make agent
#
# Runs the NetBird agent on the `netbird_agent` group (routing peers + plain
# endpoints) so each host becomes a mesh peer; a routing node
# (netbird_agent_routing: true) additionally has IP forwarding enabled. The
# management node runs the full server stack instead (playbooks/site.yml +
# roles/management).
#
# The setup key (peer_setup_key) decides the group a peer auto-joins, hence its
# role in the mesh; it is resolved from the management node's vault. The
# routed-network resources and the peer's group live in the management node's
# tenant config (netbird_networks). See roles/agent.
# ==============================================================================

- name: Join agent-only nodes to the NetBird overlay
  hosts: netbird_agent
  gather_facts: true
  roles:
    - role: agent
