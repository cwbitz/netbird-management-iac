---
# ==============================================================================
# Apply the declarative NetBird tenant configuration (desired state as code).
#
# Desired state comes from the per-host vars (main.yml for non-secret values,
# vault.yml for secrets/PII). This play renders them into a generated, gitignored
# directory and applies them to the running server's REST API via
# community.ansible_netbird:
#
#   inventory/host_vars/<host>/{main,vault}.yml -> .cache/tenant_config/<host>/ -> NetBird API
#
# Preview with `make plan` (read-only diff); apply with `make apply` (commits).
# Strict mode (also removes unmanaged resources) is off unless `tenant_strict:
# true` is set per host or passed with -e. The desired state is validated
# locally (scripts/validate_tenant_config.py) before rendering, so an unusable
# value fails before anything is rendered or applied. Requires
# vault_service_admin_access_token (created by the first-owner bootstrap, or
# set in vault.yml).
# ==============================================================================

- name: Apply NetBird tenant configuration as code
  hosts: netbird_management
  connection: local
  gather_facts: false
  vars:
    # Generated config directory (gitignored).
    tenant_build_dir: "{{ playbook_dir }}/../.cache/tenant_config/{{ inventory_hostname }}"
    config_dir: "{{ tenant_build_dir }}"
    netbird_api_url: "https://{{ domain_name }}"
    netbird_api_token: "{{ vault_service_admin_access_token | default('', true) }}"
    netbird_validate_certs: true
    tenant_commit: false
    # tenant_strict is NOT set here: it is a host-level knob (host_vars/<host>/
    # main.yml), defaulting to false where the role uses it. Set it per host or
    # with -e tenant_strict=true.
    # Run API modules with the control node's Python (connection is local).
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # Local API work only; no privilege needed.
    ansible_become: false

  tasks:
    - name: "[Tenant] Assert an access token is configured"
      ansible.builtin.assert:
        that:
          - netbird_api_token | length > 0
        fail_msg: >-
          Set vault_service_admin_access_token in
          inventory/host_vars/<host>/vault.yml. On a fresh deploy it is created
          automatically during the first-owner bootstrap; otherwise create an
          'admin' service user and its Access Token in the NetBird Dashboard
          (Team -> Service Users) and store it there. Re-run afterwards.

    - name: "[Tenant] Probe the access token against the API"
      ansible.builtin.uri:
        url: "{{ netbird_api_url }}/api/users"
        method: GET
        headers:
          Accept: application/json
          Authorization: "Token {{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        status_code: [200, 401, 403]
        return_content: false
      register: token_probe
      until: token_probe.status | default(0) in [200, 401, 403]
      retries: 10
      delay: 5
      changed_when: false
      no_log: true

    - name: "[Tenant] Stop with recovery instructions when the token is rejected"
      ansible.builtin.assert:
        that:
          - token_probe.status | default(0) == 200
        fail_msg: >-
          The NetBird access token was rejected (HTTP
          {{ token_probe.status | default('n/a') }}). Personal Access
          Tokens expire (NetBird caps them at 365 days) and cannot be renewed
          once invalid. Recreate one: log in to the Dashboard as the owner
          ({{ netbird_api_url }}), open Team -> Service Users -> 'admin' ->
          Access Tokens -> Create Access Token, then store it as
          vault_service_admin_access_token in
          inventory/host_vars/{{ inventory_hostname }}/vault.yml and re-run.

    # --------------------------------------------------------------------------
    # Routed networks bind their gateway by peer GROUP (routers[].peer_groups),
    # not by an individual peer: the group exists once this play creates it, so
    # each network applies on the first run and the client becomes its router when
    # it enrolls with the matching setup key (auto_groups).
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # Render the config directory the collection role consumes.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Clean the generated config directory"
      ansible.builtin.file:
        path: "{{ tenant_build_dir }}"
        state: absent

    - name: "[Tenant] Create the generated config directory tree"
      ansible.builtin.file:
        path: "{{ tenant_build_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "."
        - "access_control"
        - "dns"

    # --------------------------------------------------------------------------
    # Value gate: validate the effective desired state before rendering or
    # calling the API. Local and stdlib-only; references that need the live
    # account (peers, IdP-synced groups) stay the collection's own preflight.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Write the effective desired state for the value gate"
      ansible.builtin.copy:
        dest: "{{ tenant_build_dir }}/_validate.json"
        content: >-
          {{ {
               'netbird_settings': netbird_settings | default({}),
               'netbird_groups': netbird_groups | default([]),
               'netbird_policies': netbird_policies | default([]),
               'netbird_posture_checks': netbird_posture_checks | default([]),
               'netbird_networks': netbird_networks | default([]),
               'netbird_dns_nameserver_groups': netbird_dns_nameserver_groups | default([]),
               'netbird_dns_zones': netbird_dns_zones | default([]),
               'netbird_dns_disabled_management_groups': netbird_dns_disabled_management_groups | default([]),
               'netbird_setup_keys': netbird_setup_keys | default([]),
               'netbird_services': netbird_services | default([]),
               'netbird_service_domains': netbird_service_domains | default([]),
               'netbird_users': netbird_users | default([]),
               'netbird_service_users': netbird_service_users | default([])
             } | to_json }}
        mode: "0600"

    - name: "[Tenant] Run the value gate"
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/validate_tenant_config.py"
          - "{{ tenant_build_dir }}/_validate.json"
      changed_when: false

    - name: "[Tenant] Remove the value-gate input"
      ansible.builtin.file:
        path: "{{ tenant_build_dir }}/_validate.json"
        state: absent

    # netbird_settings uses the collection's native field names, except the peer
    # expiry DURATIONS, which follow the project convention (*_expire_<unit>);
    # the *_expiration_enabled toggles keep the collection names. Map the
    # durations back to the collection/API names before rendering settings.yml.
    - name: "[Tenant] Map project expiry durations to the collection's settings fields"
      ansible.builtin.set_fact:
        netbird_settings: >-
          {%- set field_map = {
               'peer_login_expire_seconds': 'peer_login_expiration',
               'peer_inactivity_expire_seconds': 'peer_inactivity_expiration' } -%}
          {%- set ns = namespace(out={}) -%}
          {%- for key, value in (netbird_settings | default({})).items() -%}
          {%-   set _ = ns.out.update({ field_map.get(key, key): value }) -%}
          {%- endfor -%}
          {{ ns.out }}

    - name: "[Tenant] Render the single-variable config files"
      ansible.builtin.copy:
        dest: "{{ tenant_build_dir }}/{{ item.path }}"
        content: "{{ {item.var: lookup('vars', item.var, default=item.default)} | to_nice_yaml(indent=2) }}"
        mode: "0600"
      loop:
        - { path: "settings.yml", var: "netbird_settings", default: {} }
        - { path: "access_control/groups.yml", var: "netbird_groups", default: [] }
        - { path: "access_control/posture_checks.yml", var: "netbird_posture_checks", default: [] }
        - { path: "access_control/policies.yml", var: "netbird_policies", default: [] }
        - { path: "dns/nameservers.yml", var: "netbird_dns_nameserver_groups", default: [] }
        - { path: "dns/zones.yml", var: "netbird_dns_zones", default: [] }
        - { path: "dns/settings.yml", var: "netbird_dns_disabled_management_groups", default: [] }
        - { path: "networks.yml", var: "netbird_networks", default: [] }
        - { path: "setup_keys.yml", var: "netbird_setup_keys", default: [] }
      loop_control:
        label: "{{ item.path }}"

    - name: "[Tenant] Render services.yml (two variables per file)"
      ansible.builtin.copy:
        dest: "{{ tenant_build_dir }}/services.yml"
        content: >-
          {{ { 'netbird_services': netbird_services | default([]),
               'netbird_service_domains': netbird_service_domains | default([]) }
             | to_nice_yaml(indent=2) }}
        mode: "0600"

    # --------------------------------------------------------------------------
    # Apply the desired state (plain names resolved to IDs, dependency order).
    # With tenant_commit=false this only produces a read-only diff.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Apply the config-as-code desired state"
      ansible.builtin.include_role:
        name: community.ansible_netbird.configure
      vars:
        commit: "{{ tenant_commit }}"
        # Strict mode is opt-in: empty/null, false, or undefined all mean
        # non-strict; only an explicit truthy value (e.g. true) enables it.
        strict: "{{ tenant_strict | default(false, true) | bool }}"

    # --------------------------------------------------------------------------
    # A setup key's secret is returned only at creation. Persist each newly
    # created key as vault_<name> in vault.yml (the key name already ends in _setup_key).
    # --------------------------------------------------------------------------
    - name: "[Tenant] Persist newly created setup key values in the vault"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: store_secret
      vars:
        secret_store_file: "vault.yml"
        # key_result.item is the original setup-key spec recorded by the
        # community.ansible_netbird configure role (its loop uses the default
        # `item` loop var, so the nested key stays `item`).
        secret_store_var: "vault_{{ key_result.item.name | regex_replace('[^A-Za-z0-9_]', '_') }}"
        secret_store_value: "{{ key_result.setup_key.key }}"
      loop: "{{ (netbird_setup_key_results | default({'results': []})).results }}"
      loop_control:
        loop_var: key_result
        label: "{{ key_result.item.name }}"
      when:
        - tenant_commit | bool
        - key_result.changed | default(false)
        - (key_result.setup_key.key | default('', true)) | length > 0

    # --------------------------------------------------------------------------
    # Users/service users use the separate netbird_user module, so they are
    # applied here (after groups). auto_groups take plain names, resolved to IDs
    # against the live groups. Runs only on commit.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Fetch groups for user auto_groups resolution"
      community.ansible_netbird.netbird_info:
        api_url: "{{ netbird_api_url }}"
        api_token: "{{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        resource: groups
      register: tenant_groups_info
      changed_when: false
      no_log: true
      when:
        - tenant_commit | bool
        - ((netbird_users | default([]) | length)
           + (netbird_service_users | default([]) | length)) > 0

    - name: "[Tenant] Map group names to IDs"
      ansible.builtin.set_fact:
        tenant_group_ids: >-
          {{ dict((tenant_groups_info.data | default([]) | map(attribute='name') | list)
                  | zip(tenant_groups_info.data | default([]) | map(attribute='id') | list)) }}
      no_log: true
      when:
        - tenant_commit | bool
        - tenant_groups_info is defined and tenant_groups_info.data is defined

    - name: "[Tenant] Build the flat user list (mark service users, resolve auto_groups)"
      ansible.builtin.set_fact:
        tenant_users_flat: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for u in (netbird_users | default([])) -%}
          {%-   set groups = (u.auto_groups | default([])) | map('extract', tenant_group_ids) | list -%}
          {%-   set _ = ns.items.append(u | combine({'is_service_user': u.is_service_user | default(false), 'auto_groups': groups})) -%}
          {%- endfor -%}
          {%- for u in (netbird_service_users | default([])) -%}
          {%-   set groups = (u.auto_groups | default([])) | map('extract', tenant_group_ids) | list -%}
          {%-   set _ = ns.items.append(u | combine({'is_service_user': u.is_service_user | default(true), 'auto_groups': groups})) -%}
          {%- endfor -%}
          {{ ns.items }}
      when: tenant_commit | bool

    - name: "[Tenant] Manage users and service users"
      community.ansible_netbird.netbird_user:
        api_url: "{{ netbird_api_url }}"
        api_token: "{{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        email: "{{ item.email | default(omit) }}"
        name: "{{ item.name | default(item.email) }}"
        role: "{{ item.role | default('user') }}"
        auto_groups: "{{ item.auto_groups | default(omit) }}"
        is_service_user: "{{ item.is_service_user | default(false) }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ tenant_users_flat | default([]) }}"
      loop_control:
        label: "{{ item.name | default(item.email) }}"
      no_log: true
      when:
        - tenant_commit | bool
        - (tenant_users_flat | default([]) | length) > 0
